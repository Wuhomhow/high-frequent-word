<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高频词句</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<header>
  <button id="btnToc" aria-label="打开目录">目录</button>
  <button id="btnSet" aria-label="设置">设置</button>
</header>
<main id="main"><button id="prev" class="arr" aria-label="上一个" title="上一个（←）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><article id="card" aria-live="polite"></article><div id="pos"><b id="posN"></b><span id="posT"></span></div><button id="next" class="arr" aria-label="下一个" title="下一个（→）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></main>
<div id="mask"></div>
<aside id="drawer" aria-label="目录">
  <div class="dh">
    <input id="q" type="search" placeholder="搜索单词或序号" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div id="toc"></div>
</aside>
<div id="sheet" role="dialog" aria-label="设置">
  <h2>设置</h2>
  <label class="row">隐藏例句中的中文提示<input type="checkbox" id="oNog"></label>
  <label class="row">切换单词时直接显示答案<input type="checkbox" id="oAns"></label>
  <label class="row">切换单词时自动朗读<input type="checkbox" id="oAuto"></label>
  <label class="row">“下一个”随机出词<input type="checkbox" id="oShuf"></label>
  <div class="row"><span>随机范围 1</span><div class="rng"><input id="r1Min" type="number" min="1" inputmode="numeric" aria-label="范围1起始序号"><span>至</span><input id="r1Max" type="number" min="1" inputmode="numeric" aria-label="范围1结束序号"></div></div>
  <div class="row"><span>随机范围 2</span><div class="rng"><input id="r2Min" type="number" min="1" inputmode="numeric" aria-label="范围2起始序号"><span>至</span><input id="r2Max" type="number" min="1" inputmode="numeric" aria-label="范围2结束序号"></div></div>
  <div class="row"><span>随机范围 3</span><div class="rng"><input id="r3Min" type="number" min="1" inputmode="numeric" aria-label="范围3起始序号"><span>至</span><input id="r3Max" type="number" min="1" inputmode="numeric" aria-label="范围3结束序号"></div></div>
  <div class="row"><span>恢复默认范围</span><button id="rAll" title="恢复为三个均分范围">恢复默认</button></div>
  <label class="row">字号<input type="range" id="oSize" min="0.85" max="1.4" step="0.05"></label>
  <label class="row">主题<select id="oTheme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  <div class="row"><span>清空收藏和已掌握记录</span><button id="oReset">清空</button></div>
  <p class="keys">快捷键：← → 切换　A 或 Enter 查看中文　S 朗读　F 收藏　M 已掌握　H 中文提示　R 随机　T 目录　Esc 关闭。<br>手机上可左右滑动切换；点击单词或例句可朗读；把鼠标移到例句中没标中文的单词上（手机上点一下），会显示它在词表中的序号。</p>
</div>
<div id="toast"></div>
<div id="tip"></div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
